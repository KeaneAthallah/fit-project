services:
  app:
    build: .
    volumes:
      - ./LAPORAN KEUANGAN:/app/LAPORAN KEUANGAN
      - ./output:/app/output
      - ./data:/app/data
      - ./logs:/app/logs
      - ./database:/app/database
    environment:
      - INPUT_DIRECTORY=/app/LAPORAN KEUANGAN
      - OUTPUT_DIRECTORY=/app/output
      - WORKERS=4
      - OCR_WORKERS=2
    # Full pipeline on the mounted input directory
    command: python main.py run --input "/app/LAPORAN KEUANGAN"
    env_file:
      - path: .env
        required: false

  # Optional: one-shot processing with a custom limit (sample mode)
  sample:
    build: .
    profiles: ["sample"]
    volumes:
      - ./LAPORAN KEUANGAN:/app/LAPORAN KEUANGAN
      - ./output:/app/output
      - ./data:/app/data
      - ./logs:/app/logs
      - ./database:/app/database
    command: python main.py run --input "/app/LAPORAN KEUANGAN" --limit 5

  # Optional: web dashboard on http://localhost:8000
  dashboard:
    build: .
    profiles: ["dashboard"]
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./database:/app/database
    command: python main.py dashboard --host 0.0.0.0 --port 8000
