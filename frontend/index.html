<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Financial Report Extractor</title>
    <script>
      /* Applies the stored theme before the first paint so the page never
         renders light and then snaps to dark. Kept inline and dependency-free
         on purpose: it has to run synchronously, ahead of the CSS bundle. */
      ;(function () {
        try {
          var stored = localStorage.getItem('fre.theme') || 'system'
          var dark =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.dataset.theme = stored
        } catch (e) {
          /* Private mode / storage disabled: fall back to light. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
